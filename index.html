    <style>
        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #111827;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #game-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 850px;
            background-color: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            z-index: 10;
        }
        .screen.active {
            display: flex;
        }
        @keyframes breathe {
            0% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.025) translateY(-4px); }
            100% { transform: scale(1) translateY(0); }
        }
        .character-breathe {
            animation: breathe 3.5s infinite ease-in-out;
            transform-origin: bottom center;
        }
        .neon-btn {
            background-color: rgba(31, 41, 55, 0.95);
            color: white;
            border: 3px solid #fbbf24;
            border-radius: 12px;
            padding: 14px 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            user-select: none;
            pointer-events: auto;
            width: 100%;
        }
        .neon-btn:active {
            transform: scale(0.96);
        }
        .dialog-box-new {
            background-color: rgba(255, 255, 255, 0.95);
            border: 6px solid #fbbf24;
            border-radius: 16px;
            padding: 20px 16px 16px 16px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            min-height: 100px;
            pointer-events: auto;
        }
        .comic-btn {
            background-color: #fde047;
            border: 4px solid #1f2937;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #1f2937;
            box-shadow: 4px 4px 0px #1f2937;
            transition: all 0.1s ease-in-out;
            cursor: pointer;
            text-align: center;
        }
        .comic-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #1f2937;
        }
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.2s ease-out;
        }
        .modal-card {
            background: white;
            border: 4px solid #1f2937;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.5);
            text-align: center;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }

    <script>
        // 音效引擎防崩溃处理
        let audioCtx=null, bgmInterval=null;
        
        function initAudio(){
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return; 
                if (!audioCtx) audioCtx = new AudioContextClass();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {
                console.warn("音频初始化被拦截:", e);
            }
        }
        
        function startBGM(){
            if(bgmInterval || !audioCtx) return;
            bgmInterval=setInterval(()=>{
                try {
                    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
                    osc.type='triangle';
                    const notes=[261.63,293.66,329.63,392.00,440.00,523.25];
                    osc.frequency.setValueAtTime(notes[Math.floor(Math.random()*notes.length)],audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.03,audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);
                    osc.connect(gain);gain.connect(audioCtx.destination);
                    osc.start();osc.stop(audioCtx.currentTime+0.25);
                } catch(e) {}
            },350);
        }
        
        function playClickSound(){
            if(!audioCtx) return;
            try{
                const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
                osc.type='sine';
                osc.frequency.setValueAtTime(400,audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800,audioCtx.currentTime+0.1);
                gain.gain.setValueAtTime(0.1,audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1);
                osc.connect(gain);gain.connect(audioCtx.destination);
                osc.start();osc.stop(audioCtx.currentTime+0.12);
            }catch(e){}
        }
        
        function playSuccessSound(){
            if(!audioCtx) return;
            try{
                const now=audioCtx.currentTime;
                [523.25,659.25,783.99].forEach((n,i)=>{
                    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
                    osc.frequency.setValueAtTime(n,now+i*0.08);
                    gain.gain.setValueAtTime(0.1,now+i*0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.2);
                    osc.connect(gain);gain.connect(audioCtx.destination);
                    osc.start(now+i*0.08);osc.stop(now+i*0.08+0.25);
                });
            }catch(e){}
        }
        
        function playFailSound(){
            if(!audioCtx) return;
            try{
                const now=audioCtx.currentTime;
                [200,150].forEach((n,i)=>{
                    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
                    osc.type='sawtooth';
                    osc.frequency.setValueAtTime(n,now+i*0.15);
                    gain.gain.setValueAtTime(0.12,now+i*0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001,now+i*0.15+0.3);
                    osc.connect(gain);gain.connect(audioCtx.destination);
                    osc.start(now+i*0.15);osc.stop(now+i*0.15+0.35);
                });
            }catch(e){}
        }

        {level:25,speaker:"叨哥",bgImage:"level25.jpg",dialogue:"我去当伴郎，拉你一起接新娘有红包！",options:[{text:"高高兴兴去",correct:false,msg:"被伴娘疯狂整蛊，红包只2块还要洗碗。"},{text:"抢着去挡酒",correct:false,msg:"被灌三斤白酒，吐了一夜。"},{text:"在家等吃席",correct:true,msg:"完美避开折腾，舒舒服服吃喜宴。"}]},
        {level:26,speaker:"叨哥",bgImage:"level26.jpg",dialogue:"撞碎村委会盆栽了，帮看着有人来咳嗽一声！",options:[{text:"帮忙放哨",correct:false,msg:"村长从后面拍你，一起写检讨赔偿。"},{text:"帮拿胶水粘",correct:false,msg:"粘歪七扭八被村支书当场抓获。"},{text:"说没看见迅速跑路",correct:true,msg:"大难临头各自飞，免受牵连。"}]},
        {level:27,speaker:"叨哥",bgImage:"level27.jpg",dialogue:"老表，急用，把安卓 Type-C 充电线借我一下！",options:[{text:"爽快借给",correct:false,msg:"用完直接顺走，问就是不知道丢哪了。"},{text:"让他押身份证",correct:false,msg:"拿过期会员卡糊弄你，回头找不到人。"},{text:"说自己用的是苹果",correct:true,msg:"掏出苹果线拒绝，保住贵重物品。"}]},
        {level:28,speaker:"叨哥",bgImage:"level28.jpg",dialogue:"我恐高，快帮我爬上屋顶抓橘猫！",options:[{text:"热心爬上瓦顶",correct:false,msg:"踩碎瓦片没抓着猫，被阿婆骂半小时。"},{text:"拿竹竿在下面捅",correct:false,msg:"把蜂窝捅了，被野黄蜂追得狂奔。"},{text:"在树下用猫粮引",correct:true,msg:"猫自己乖乖跳了下来。"}]},
        {level:29,speaker:"叨哥",bgImage:"level29.jpg",dialogue:"下暴雨没带伞，快让个位挤一挤！",options:[{text:"心软挤伞",correct:false,msg:"伞全倾向他，你淋透重感冒发烧。"},{text:"伞给他自己淋",correct:false,msg:"伞借给别人再没回来。"},{text:"掏塑料袋套他头上",correct:true,msg:"你撑伞优雅走开，他套塑料袋狂奔。"}]},
        {level:30,speaker:"叨哥",bgImage:"level30.jpg",dialogue:"发工资了！去大酒店请客，不来不是兄弟！",options:[{text:"兴冲冲赴宴",correct:false,msg:"结账他装醉不省人事，你掏2000买单。"},{text:"抢先把单买了",correct:false,msg:"正中下怀，他还打包带走两只帝王蟹。"},{text:"推脱陪妈妈吃饭",correct:true,msg:"完美推掉终极鸿门宴，保住钱包。"}]},
        {level:31,speaker:"系统提示",bgImage:"",dialogue:"【终极关卡通关大考】<br><br>经历了这么多，请问：叨哥的同学到底叫什么名字？",options:[{text:"面包",correct:false,msg:"那是早餐，不是同学！重头来过吧！"},{text:"LV包包",correct:false,msg:"太奢侈了，他不配有这么贵气的同学！"},{text:"肉包",correct:true,msg:"回答正确！肉包才是永远滴神！恭喜通关！"}]}
        ];

        let currentIndex=0;
        const elScreenStart=document.getElementById('screen-start'),elScreenGame=document.getElementById('screen-game'),elScreenVictory=document.getElementById('screen-victory');
        const elSpeaker=document.getElementById('ui-speaker'),elDialogue=document.getElementById('ui-dialogue'),elOptions=document.getElementById('ui-options'),elBgLayer=document.getElementById('bg-layer');
        const elModal=document.getElementById('modal'),elModalTitle=document.getElementById('modal-title'),elModalDesc=document.getElementById('modal-desc'),elModalBtn=document.getElementById('modal-btn'),elModalCard=document.getElementById('modal-card');

        // 新增：让预加载在网页一打开时立刻执行，而不是等点击开始！
        window.onload = () => {
            const imagesToPreload = gameData.map(d => d.bgImage).filter(Boolean);
            imagesToPreload.forEach(src => {
                const img = new Image();
                img.src = src;
            });
        };

        function startGame(){
            try {
                elScreenStart.classList.remove('active');
                elScreenGame.classList.add('active');
                currentIndex=0;
                loadLevel();
            } catch(err) {
                console.error("界面加载出错:", err);
            }
            
            try {
                initAudio();
                startBGM();
                playClickSound();
            } catch(err) {
                console.warn("由于浏览器限制，音频加载失败，不影响游戏体验");
            }
        }
        
        function shuffleArray(arr){let c=arr.length,r;while(c!=0){r=Math.floor(Math.random()*c);c--;[arr[c],arr[r]]=[arr[r],arr[c]];}return arr;}

        function loadLevel(){
            const data=gameData[currentIndex];
            elBgLayer.style.backgroundImage=`url('${data.bgImage?data.bgImage:'image_b1ec04.jpg'}')`;
            elSpeaker.innerText=data.speaker;elDialogue.innerHTML=data.dialogue;
            elSpeaker.style.backgroundColor=data.speaker==="系统提示"?"#9ca3af":"#fbbf24";
            elSpeaker.style.color=data.speaker==="系统提示"?"white":"black";
            elOptions.innerHTML='';
            const opts=shuffleArray([...data.options]),labels=['A','B','C'];
            opts.forEach((o,i)=>{
                const btn=document.createElement('div');btn.className=`neon-btn`;
                btn.innerHTML=`<span class="text-yellow-400 mr-3 text-2xl font-black">${labels[i]}:</span><span class="flex-1 text-lg">${o.text}</span>`;
                btn.onclick=()=>{
                    try{ playClickSound(); }catch(e){}
                    handleChoice(o.correct,o.msg);
                };
                elOptions.appendChild(btn);
            });
        }

        function handleChoice(isCor,msg){
            elModalDesc.innerText=msg;
            if(isCor){
                try{ playSuccessSound(); }catch(e){}
                const titleText = currentIndex===gameData.length-1 ? "太牛了！😎" : `第 ${gameData[currentIndex].level} 关 通关！🎉`;
                showModal(titleText,msg,true,currentIndex===gameData.length-1);
            }
            else{
                try{ playFailSound(); }catch(e){}
                showModal("游戏失败！😭",msg,false,false);
            }
        }

        function showModal(title,desc,isCor,isVic){
            elModalTitle.innerText=title;elModalTitle.style.color=isCor?'#10b981':'#ef4444';elModalCard.style.borderColor=isCor?'#10b981':'#ef4444';
            elModalBtn.innerText=isCor?(isVic?"查看最终结局":"进入下一关"):"重新尝试本关";
            elModalBtn.onclick=()=>{
                try{ playClickSound(); }catch(e){}
                elModal.classList.remove('active');
                if(isCor){
                    if(isVic){
                        elScreenGame.classList.remove('active');
                        elScreenVictory.classList.add('active');
                    }else{
                        currentIndex++;
                        loadLevel();
                    }
                }
            };
            elModal.classList.add('active');
        }
    </script>
</body>
